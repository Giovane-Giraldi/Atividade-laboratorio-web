    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        
          <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 	    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        
 
        h2 {
            text-align: center;
            padding: 12px;

        #mapa {
            height: 85vh;
            width: 100%;

</head>
<body>
     <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

            <a class="navbar-brand" href="index.html">index</a>
            <a class="navbar-brand" href="mapa.html">Mapa</a>

            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"

        </div>

    <h2>Mapa da Região de Mauá - SP</h2>
    <div id="mapa"></div>
 
   
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 
    <script>
        // Criando o mapa e definindo o zoom inicial
        const mapa = L.map('mapa').setView(
            [-23.6677, -46.4613], 13
        );
 
        // Camada de mapa base
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(mapa);
 
        //Etec 
        L.marker([-23.6656, -46.4619])
            .addTo(mapa)
            .bindPopup('<b>Etec Mauá</b>');
 
        //Fatec 
        L.marker([-23.6680, -46.4600])
            .addTo(mapa)
            .bindPopup('<b>Fatec Mauá</b>');
 
        //Prefeitura de Mauá
        L.marker([-23.6685, -46.4615])
            .addTo(mapa)
            .bindPopup('<b>Prefeitura do Município de Mauá</b>');
 
        //limites do município
        const limitesMunicipio =
            'https://geo.cati.sp.gov.br/server/rest/services/Hosted/IGC_Limites_municipais/FeatureServer/0/query?where=nome%3D%27Mau%C3%A1%27&outFields=nome&returnGeometry=true&outSR=4326&f=geojson';
 
        fetch(limitesMunicipio)
            .then(resposta => resposta.json())
            .then(dados => {
                L.geoJSON(dados, {
                    style: {
                        color: 'red',
                        weight: 3,
                        fillColor: '#ffcccb',
                        fillOpacity: 0.15
                    }
                }).addTo(mapa);
            })
            .catch(erro => {
                console.error(
                    'Erro ao carregar os limites do município:',
                    erro
                );
            });
    </script>
 
</body>
</html>
